name: Test Coverage

on:
  push: 
    branches: ["main", "dev"]
  pull_request: 
    branches: ["main", "dev"]

jobs:
  coverage:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 26
      uses: actions/setup-java@v5
      with:
        java-version: '26'
        distribution: 'corretto'
        cache: maven
    - name: Run tests with JaCoCo
      working-directory: PersonalityQuest
      run: mvn -B test jacoco:report --file pom.xml
    - name: Publish coverage to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: PersonalityQuest/target/site/jacoco
        target-folder: coverage
